<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Dev-shell title only: this is a native-federation REMOTE. When federated
       into the hugmesh.net host the host shell owns the browser tab
       title; the "(remote)" suffix is the accepted convention for a document
       never served to end users on its own (see the branding baseline). -->
  <title>HugMesh Moderator (remote)</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HugMesh moderator console — federation moderation queue, ban/domain-lock/block, and automated edge-AI finding triage." />
  <meta name="theme-color" content="#0a0a12" />
  <!-- Canonical HugMesh favicon (relative href — the host serves the remote
       under a base-href-scoped path once federated). -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Runtime theme (fleet 50-snap-theme.sh mechanism): RELATIVE href so it
       resolves under this app's mount behind the gateway; the file's
       :root:root block out-specifies the compiled :root fallbacks regardless
       of stylesheet order. Empty when unthemed (zero-byte 200, no 404). -->
  <link rel="stylesheet" href="snap-theme.css">
</head>
<body>
  <hug-mod-root></hug-mod-root>
</body>
</html>
