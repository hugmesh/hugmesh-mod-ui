name: Release

# Builds the mod-ui container image and pushes it to GHCR.
#
#   push to main                  -> :main and :sha-<12 hex>
#   push of tag v<version>        -> :<version>, :beta (beta versions only) and
#                                    :sha-<12 hex>, plus a GitHub prerelease
#   workflow_dispatch on main     -> same as a push to main
#   workflow_dispatch on a v* tag -> re-runs that release; an image or GitHub
#                                    release that already exists is left alone
#   anything else                 -> refused by the version job
#
# The version source is package.json "version" (package-lock.json must match).
# A tag must equal "v" + that version and point at a commit on main.
# A published version tag is never overwritten, and :latest is never pushed.
#
# This workflow has no pull_request trigger and must never get one. Jobs run on
# the self-hosted runner only when the repo variable RUNS_ON_PUBLISH is set
# (a JSON array such as ["self-hosted","Linux","X64"]) AND the event is a push
# or dispatch on main or a v* tag; otherwise they run on ubuntu-latest.
# Deleting RUNS_ON_PUBLISH sends every job back to hosted runners.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-mod-ui

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      sha12: ${{ steps.v.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and check the version
        id: v
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          lock="$(python3 -c 'import json; l = json.load(open("package-lock.json")); print(l["version"], l["packages"][""]["version"])')"
          if [ "$lock" != "$version $version" ]; then
            echo "::error::package-lock.json version ($lock) does not match package.json ($version)"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/main)
              kind=main
              ;;
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
                exit 1
              fi
              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
                echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
                exit 1
              fi
              kind=release
              ;;
            *)
              echo "::error::refusing to publish from $GITHUB_REF (only main and v* tags publish)"
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "kind=$kind"
            echo "sha12=${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version kind=$kind ref=$GITHUB_REF"

  # Same unit-test gate as the GitLab pipeline's `test` job, which
  # `build:image` needs. The checkout is mounted read-only and copied inside
  # the container, so nothing root-owned is left in a self-hosted workspace.
  test:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unit tests (Karma, headless Chromium)
        run: |
          docker run --rm --shm-size=1gb -v "$PWD:/src:ro" node:24-alpine sh -euc '
            apk add --no-cache chromium >/dev/null
            mkdir /work
            cd /src
            tar --exclude=./.git --exclude=./node_modules -cf - . | tar -xf - -C /work
            cd /work
            npm ci --no-audit --no-fund
            CHROME_BIN=/usr/bin/chromium npm test
          '

  image:
    needs: [version, test]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The GHCR login below goes to the default Docker config on purpose: the
      # provenance step (actions/attest-build-provenance, push-to-registry) reads its
      # ghcr.io credential from there and fails with "No credentials found for
      # registry ghcr.io" when the login is redirected to a private config directory
      # (hugmesh-mastodon-ui run 39840293063). This job always runs on a fresh
      # GitHub-hosted runner, so nothing shares that config with another job.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        id: exists
        run: |
          set -uo pipefail
          if [ "$KIND" != release ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$IMAGE_NAME:$VERSION"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::notice::$ref is already published; it is not rebuilt or overwritten"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$ref is already published. A published version is never overwritten: raise the beta number instead."
            exit 1
          fi
          case "$out" in
            *": not found"*)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Fail closed: an auth or network error must not look like "absent".
              # A package that has never been pushed also lands here; publish
              # main first (it creates the package), then re-run this tag.
              echo "::error::could not tell whether $ref exists: $out"
              exit 1
              ;;
          esac

      - name: Compute tags and labels
        id: meta
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "$KIND" = release ]; then
            tags="$IMAGE_NAME:$VERSION"
            case "$VERSION" in
              *-beta.*) tags="$tags"$'\n'"$IMAGE_NAME:beta" ;;
            esac
            label_version="$VERSION"
          else
            tags="$IMAGE_NAME:main"
            label_version=main
          fi
          tags="$tags"$'\n'"$IMAGE_NAME:sha-$SHA12"
          {
            echo "tags<<EOF_TAGS"
            echo "$tags"
            echo "EOF_TAGS"
            echo "labels<<EOF_LABELS"
            echo "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.version=$label_version"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "EOF_LABELS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"
          echo "$tags"

      - name: Build and push image
        id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          if "latest" in tags:
              sys.exit("::error::a :latest tag was pushed; beta images must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the GitHub prerelease
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          case "$VERSION" in
            *-*) args+=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
