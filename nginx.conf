# Per-response CSP nonce source. nginx has no built-in random generator, but
# $request_id is a fresh 32-hex-char token minted for every single request, so it
# is a sound nonce: unguessable and different on each response. The `map` exposes
# it as $cspnonce, which is injected into BOTH the script-src directive AND every
# <script> tag of index.html (sub_filter below) so the two ALWAYS agree.
#
# Scope note: this file is installed by the Dockerfile as
# /etc/nginx/conf.d/default.conf, which the stock nginx.conf pulls in with
# `include /etc/nginx/conf.d/*.conf;` from INSIDE the http block — so a bare
# `map` (an http-scope directive) at the top of this file is legal here. If this
# conf is ever promoted to replace /etc/nginx/nginx.conf wholesale, the map and
# server below must be wrapped in an explicit `http { ... }` block.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows. Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (consistent with the
    #     CSP frame-ancestors 'none' below) — this remote is loaded by the host
    #     shell via <script> (native federation), NOT via <iframe>, so no framing
    #     is ever required.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # WHY THIS BLOCK MUST SEND A CSP AT ALL: the TLS front door
    # (hugmesh-gateway SecurityConfig) applies a blanket fallback
    # `default-src 'self'; script-src 'self'; ...` to any upstream response that
    # carries NO CSP of its own. Angular native-federation's generated index.html
    # bootstraps through an INLINE `<script type="esms-options">` block and loads
    # the main bundle as `type="module-shim"`. Under a bare `script-src 'self'`
    # that inline block is blocked, es-module-shims is never configured, the
    # module-shim bundle never executes, Angular NEVER BOOTSTRAPS, and /mod/
    # renders a completely blank page with no server error. Sending our own
    # nonce-based CSP here pre-empts the gateway fallback and fixes that.
    #
    # Content-Security-Policy (strong, nonce-based XSS backstop). There is NO
    # 'unsafe-inline' / 'unsafe-hashes' in script-src — only the per-response
    # nonce. ('unsafe-inline' would in fact be IGNORED by browsers whenever a
    # nonce is present, so it is strictly worse than useless.) The sub_filter
    # below rewrites every '<script' in index.html to carry nonce="$cspnonce",
    # and es-module-shims (2.8.1, listed in package.json + angular.json
    # polyfills) auto-propagates that nonce to the module scripts it injects, so
    # native federation keeps working.
    #
    # TUNED TO WHAT THIS UI ACTUALLY DOES. The moderation console is a pure
    # text/metadata console — the source was audited for capability evidence and
    # this policy is deliberately TIGHTER than the media-heavy matrix-ui one:
    #   - default-src 'self'                        : same-origin default for
    #                                                  everything not named below.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only nonce'd same-origin
    #                                                  scripts run. blob: is
    #                                                  required because
    #                                                  es-module-shims executes
    #                                                  rewritten ES modules from
    #                                                  blob: object URLs.
    #                                                  NO 'wasm-unsafe-eval' —
    #                                                  the source contains no
    #                                                  WebAssembly/wasm use at all.
    #   - style-src 'self' 'unsafe-inline'          : Angular injects component
    #                                                  styles as <style> elements
    #                                                  at runtime and they cannot
    #                                                  be nonce'd, so
    #                                                  'unsafe-inline' is REQUIRED
    #                                                  here (styles only — never
    #                                                  scripts).
    #   - img-src 'self' data:                      : only same-origin favicon.ico
    #                                                  plus any build-inlined
    #                                                  data: asset. There is not a
    #                                                  single <img>/[src] binding
    #                                                  or url() in src/**, and the
    #                                                  edge-AI "avatar/image
    #                                                  findings" are metadata rows
    #                                                  (subject/surface/status),
    #                                                  never rendered imagery — so
    #                                                  no remote https: images.
    #   - font-src 'self'                           : $font-sans is
    #                                                  `Arial, Helvetica,
    #                                                  sans-serif` — system fonts
    #                                                  only, no @font-face and no
    #                                                  webfont files.
    #   - connect-src 'self'                        : every XHR is SAME-ORIGIN.
    #                                                  The generated ng-openapi-gen
    #                                                  client's rootUrl defaults to
    #                                                  '' and nothing calls
    #                                                  provideApiConfiguration(),
    #                                                  so it hits /bff/mod/** (and
    #                                                  /bff/admin/** for the
    #                                                  refer-to-admin path) on this
    #                                                  same origin, carrying the
    #                                                  HttpOnly bff_ cookie via the
    #                                                  interceptor's
    #                                                  withCredentials. There is NO
    #                                                  WebSocket and NO SSE — the
    #                                                  source states outright that
    #                                                  there is no mod-facing SSE
    #                                                  endpoint — so no wss: and no
    #                                                  broad https: egress is
    #                                                  granted to this
    #                                                  admin-capable console.
    #   - worker-src 'self'                         : no `new Worker`, no
    #                                                  serviceWorker, no
    #                                                  importScripts anywhere in
    #                                                  src/** — blob: workers are
    #                                                  deliberately NOT allowed.
    #   - media-src 'none'                          : no <video>/<audio>/HLS/
    #                                                  MediaSource/getUserMedia.
    #   - frame-src 'none'                          : this app embeds no iframes
    #                                                  (unlike matrix-ui's games
    #                                                  portal frame).
    #   - form-action 'self'                        : every <form> is an Angular
    #                                                  (ngSubmit) handler with
    #                                                  novalidate and no native
    #                                                  action attribute, so no
    #                                                  cross-origin form POST is
    #                                                  ever legitimate.
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : no framing OF this app
    #                                                  (mirrors X-Frame-Options
    #                                                  DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards ALL inherited ones — so the CSP + the full security
    # header set are re-declared here, in the block that actually serves
    # index.html (where XSS would run).
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags (the
        #                           esms-options inline block, es-module-shims,
        #                           the module-shim app bootstrap) — rewrite ALL
        #                           of them, not just the first.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; JS/CSS
        #                           bundles (which can legitimately contain the
        #                           literal string "<script") are left
        #                           byte-for-byte untouched.
        # Do NOT enable gzip_static / ship a precompressed index.html — sub_filter
        # cannot rewrite an already-compressed response body, which would leave
        # the <script> tags un-nonced and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: this location has its OWN add_header, so
        # the server-scope security headers are NOT inherited — repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data:; font-src 'self'; connect-src 'self' blob:; worker-src 'self'; media-src 'none'; frame-src 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        # nginx add_header inheritance: this location has its OWN add_header, so
        # the server-scope security headers are NOT inherited — repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Type text/plain;
    }
}
